# 依赖更新：GitHub Actions 每月检查一次；本仓库是零运行时依赖，devDependencies 也按月。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # React 19 是大版本；渲染回归测试基于 React 18，适配前不要自动开 major PR
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
