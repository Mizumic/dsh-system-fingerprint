name: 功能建议
description: 提出新功能或改进建议
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，而不是直接给实现方案。
        注意本项目的硬约束：单向依赖、隐私默认（`captureRaw` 默认关）、宿主半边单文件。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在的行为哪里不够用？在什么场景下遇到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可选。如果涉及新配置项，请说明默认值（必须向后兼容）

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案不引入对 driftmon 或其他外部监测项目的代码依赖
        - label: 方案不会破坏默认隐私语义（不默认落模型正文、不记录凭据）
        - label: 方案不要求宿主半边引入相对 import（破坏 `?v=N` 热加载）
