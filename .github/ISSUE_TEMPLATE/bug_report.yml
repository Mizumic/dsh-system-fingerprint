name: Bug 报告
description: 报告可复现的问题（安全漏洞请走 SECURITY.md，不要开公开 issue）
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认：这是**插件**的问题，而不是上游模型/网关/DSH 宿主的问题。
        提交前请移除日志里的 API key、session id、模型正文等敏感信息。

  - type: input
    id: version
    attributes:
      label: 插件版本
      description: package.json 的 version，或 DSH 插件页显示的版本
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: DSH 版本、Node 版本、操作系统、路由类型（官方 / 网关）
      placeholder: "DSH 0.2.0-rc.2 / Node 22 / Linux / api.deepseek.com"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际看到了什么？徽标文案 / 悬浮卡 / 状态接口返回值 / 磁盘产物
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 尽量给出最小步骤；能附带 `GET /api/system-fingerprint/state` 的脱敏响应更好
      placeholder: |
        1. 安装 bundle …（配置片段）
        2. 发送一条对话
        3. 悬停徽标 …
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 日志（已脱敏）、截图、相关 issue

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除日志/截图中的 API key、session id、模型回复正文等敏感信息
          required: true
